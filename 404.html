<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the forest · Dakshata Shyam</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/fonts.c7810c7b.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#14121F;color:#F3EADB;font-family:"DM Sans","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;text-align:center;padding:24px}
.eye{width:120px;height:120px;border-radius:50%;background:#F3EADB;position:relative;margin:0 auto 28px;animation:blink 5s infinite}
.eye::after{content:"";position:absolute;inset:32px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#FFF8EE 0 9%,#1E150E 10% 46%,#5A381F 47% 100%)}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
h1{font-family:"Archivo","Arial Black",sans-serif;font-weight:900;font-size:clamp(40px,8vw,72px);line-height:1;margin:0 0 12px}
p{margin:0 auto 28px;max-width:34ch;line-height:1.55;opacity:.8}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;text-decoration:none;font-weight:500}
.solid{background:#D42A1F;color:#FFF3EC}.line{border:1px solid #F3EADB;color:#F3EADB}
a:focus-visible{outline:2px solid #F3EADB;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.eye{animation:none}}
</style>
<script src="/assets/js/cursor.94b77517.js" defer></script>
</head>
<body>
<main>
  <div class="eye" aria-hidden="true"></div>
  <h1>Wrong turn</h1>
  <p>This page wandered off. The best ideas take a wrong turn and come back stranger, but this one hasn't come back yet.</p>
  <div class="row"><a class="solid" href="/#work">See the work</a><a class="line" href="/">Back home</a></div>
</main>
</body>
</html>
